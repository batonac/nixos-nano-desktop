# Fcitx5 Wayland input-method frontend.
#
# PersistentVirtualKeyboard MUST stay False (fcitx5's own default). It is an
# upstream workaround for compositors that mishandle a re-created virtual
# keyboard (Sway <= 1.9, RiverWM <= 0.3.0); labwc is not one of them, and on
# labwc it breaks Alt-Tab:
#
#   fcitx5 mirrors the modifier state it receives on its keyboard grab back
#   through zwp_virtual_keyboard_v1, and labwc's keyboard_get_all_modifiers()
#   ORs every virtual keyboard's modifiers into the physical ones. Starting
#   the window switcher takes keyboard focus away (cycle_begin ->
#   seat_focus_override_begin), which deactivates the input method, so the
#   physical Alt release is never forwarded to fcitx5. With the virtual
#   keyboard kept alive it stays stuck holding Alt forever, that OR never
#   returns 0, and the handle_modifiers() path that ends window cycling on
#   modifier release never fires — the switcher hangs on screen until a
#   thumbnail is clicked. With the default False, fcitx5 destroys the virtual
#   keyboard on deactivate, the stale modifier goes with it, and releasing Alt
#   commits to the selected window the way it should.
#
# The cost of False is what this file used to work around: fcitx5 creates and
# destroys the virtual keyboard on every text-field focus change, and each
# create pushes a fresh keymap through labwc into Xwayland, which re-runs
# xkbcomp and logs "Unsupported maximum keycode 709, clipping". That cost is
# now largely moot — fcitx5 runs with --disable=xcb,xim (see the fcitx5 service
# in flake.nix), so nothing holds Xwayland open and there is usually no X
# server to push a keymap into at all.
PersistentVirtualKeyboard=False
