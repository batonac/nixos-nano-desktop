# Nano Desktop GTK4 settings, installed to /etc/xdg/gtk-4.0/settings.ini and
# read via XDG_CONFIG_DIRS.
#
# This file is for PLAIN GTK4 apps (image-roll is the one here). libadwaita
# apps take almost none of it: libadwaita overrides gtk-theme-name with its
# own stylesheet and gets its colours from the dconf color-scheme instead —
# which it only reads because ADW_DISABLE_PORTAL=1 is set in
# modules/desktop.nix. Nothing in this file will make a libadwaita app dark.
[Settings]
gtk-theme-name=Orchis-Dark
gtk-icon-theme-name=Tela-dark
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
# Load-bearing, despite what the warning says. This is the ONLY thing making
# plain GTK4 apps dark — verified by A/B on image-roll, which is dark with
# this line and light without it, everything else held constant.
#
# libadwaita apps log "Using GtkSettings:gtk-application-prefer-dark-theme
# with libadwaita is unsupported" on every start because of it. That warning
# is correct and harmless: libadwaita ignores the setting and uses the
# color-scheme route above. Deleting the line to silence the warning would
# silently turn the plain GTK4 apps light.
gtk-application-prefer-dark-theme=1
