# Nano Desktop fuzzel launcher — modern Adwaita DARK.
# Opened from the Sfwbar Start button and the F12 / Alt-F2 keybinds. Installed
# to /etc/xdg/fuzzel/fuzzel.ini (read via XDG_CONFIG_DIRS, like the gtk/foot
# configs). fuzzel draws its own window with the colours below, so — unlike a
# GTK popup menu — it never depends on which GTK theme the session resolves.

font=Adwaita Sans:size=13
dpi-aware=no
prompt="Search "
# The desktop's icon theme (see nanoIconTheme in modules/applications.nix,
# and the dconf icon-theme key every GTK app here follows). fuzzel walks the
# Inherits chain from here — MoreWaita → Adwaita → AdwaitaLegacy → hicolor —
# so it resolves the same names the panel's menu does.
#
# This has to name a theme that exists. fuzzel does not fall back to the
# user's theme when the configured one is missing; icon_load_theme() simply
# finds nothing to load and then appends hicolor, which the spec requires of
# it regardless (icon.c). A stale name here is therefore not a styling
# difference but a truncation: everything answered by MoreWaita, Adwaita or
# AdwaitaLegacy disappears from the launcher — the file manager, the task
# manager, the settings app, VS Code — while apps carrying their own branded
# icon in hicolor keep theirs, which is what makes it read as "some icons are
# missing" rather than "the theme is wrong".
icon-theme=MoreWaita
# Respect OnlyShowIn / NotShowIn against XDG_CURRENT_DESKTOP (= labwc).
# fuzzel parses both keys and then ignores them unless this is on, which is
# how the launcher and the panel's menu came to disagree about what is
# installed: Sfwbar's appmenu gates every entry on
# g_desktop_app_info_get_show_in (modules/appmenu.c), so an entry marked for
# another desktop was hidden there and listed here. blueman-adapters is the
# one that shows up today (OnlyShowIn=XFCE;MATE — its adapter dialog is the
# XFCE settings-manager plugin, and the panel's bluetooth widget and
# blueman-manager cover what it does), but the point is the class rather
# than the instance: an entry that says where it belongs should be believed
# by both launchers.
filter-desktop=yes
# Match on more than the visible name — this is a search box, and the word
# someone reaches for is often not the word on the entry. generic finds
# Firefox by "browser"; keywords finds the settings app by "password" or
# "update", and PCManFM by the brand name that modules/applications.nix
# takes off its Name and puts here instead.
fields=name,generic,keywords,comment
line-height=26
lines=12
width=32
horizontal-pad=16
vertical-pad=12
inner-pad=8
anchor=center
layer=overlay

[colors]
# libadwaita dark tokens: #242226 window, white text, the
# nanoDesktop.accentColor accent for the selection.
background=242226f5
text=ffffffff
prompt=ffffffff
placeholder=ffffff80
input=ffffffff
match=78aeedff
selection=@ACCENT@ff
selection-text=ffffffff
selection-match=ffffffff
counter=ffffff80
border=1c1c1fff

[border]
width=1
radius=12
