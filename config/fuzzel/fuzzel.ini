# Nano Desktop fuzzel launcher — modern Adwaita DARK.
# Opened from the Sfwbar Start button and the F12 / Alt-F2 keybinds. Installed
# to /etc/xdg/fuzzel/fuzzel.ini (read via XDG_CONFIG_DIRS, like the gtk/foot
# configs). fuzzel draws its own window with the colours below, so — unlike a
# GTK popup menu — it never depends on which GTK theme the session resolves.

font=Adwaita Sans:size=13
dpi-aware=no
prompt="Search "
# Colloid-Dark, the desktop's icon theme. Its index.theme is rewritten at
# build time to inherit Colloid-Light then hicolor (see nanoIconTheme in
# modules/applications.nix), so fuzzel following the Inherits chain finds an
# icon for everything the app menu shows.
icon-theme=Colloid-Dark
fields=name,generic,comment
line-height=26
lines=12
width=32
horizontal-pad=16
vertical-pad=12
inner-pad=8
anchor=center
layer=overlay

[colors]
# libadwaita dark tokens: #242226 window, white text, the
# nanoDesktop.accentColor accent for the selection.
background=242226f5
text=ffffffff
prompt=ffffffff
placeholder=ffffff80
input=ffffffff
match=78aeedff
selection=@ACCENT@ff
selection-text=ffffffff
selection-match=ffffffff
counter=ffffff80
border=1c1c1fff

[border]
width=1
radius=12
